name: Contract baseline
on: [push, pull_request]
jobs:
  script-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contracts/requirements.txt
      - run: python -m unittest discover -s backend/tests/contract -v
      - run: python contracts/scripts/validate.py
